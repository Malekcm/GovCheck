# Render.com blueprint — GovCheck pilot on Render Free + Supabase.
#
# The web service only serves the app and the API. All state lives in Supabase
# (DATABASE_URL); Render's disk is temporary and is never relied on.
# Scheduled source checks run from GitHub Actions (.github/workflows/scheduled-sync.yml)
# directly against Supabase, because a free instance sleeps when idle.
# Step-by-step guide: docs/DEPLOY_SUPABASE_RENDER.md
services:
  - type: web
    name: govcheck
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Release deployment is a separate explicit action after a tested main merge.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Refuse to start on the temporary embedded database by mistake.
      - key: REQUIRE_DATABASE_URL
        value: "true"
      # GitHub Actions owns scheduled syncing; the free web instance would sleep anyway.
      - key: SCHEDULER_ENABLED
        value: "false"
      # Small connection pool: Supabase Free allows a limited number of connections.
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_URL
        sync: false
      # Supabase CA certificate, base64-encoded on one line (see the deployment guide).
      - key: DATABASE_SSL_CA_BASE64
        sync: false
      - key: SAM_API_KEY
        sync: false
      - key: TANGO_API_KEY
        sync: false
      - key: TANGO_ENABLED
        value: "false"
      - key: TANGO_AUTO_SYNC
        value: "false"
      - key: TANGO_INTERNAL_DAILY_CAP
        value: "80"
      - key: TANGO_PROVIDER_RESERVE
        value: "20"
      - key: TANGO_MANUAL_RESERVE
        value: "10"
      - key: SAM_DAILY_REQUEST_LIMIT
        value: "10"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOVCHECK_TEAM_AUTH_ENABLED
        value: "false"
      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOVCHECK_RESEARCH_ENABLED
        value: "false"
      - key: RESEARCH_ESTIMATED_COST_USD
        sync: false
      - key: G2X_INTERACTIVE_RESEARCH_ENABLED
        value: "false"
      - key: G2X_CLIENT_ID
        sync: false
